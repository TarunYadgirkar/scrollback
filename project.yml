name: Scrollback
options:
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
# Team, bundle ID prefix, iCloud container and App Group come from Config/Base.xcconfig,
# which reads your own values from Config/Secrets.xcconfig.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  ScrollbackCore:
    path: Packages/ScrollbackCore
targets:
  ScrollbackMac:
    type: application
    platform: macOS
    sources: [Apps/Shared, Apps/Mac]
    dependencies:
      - package: ScrollbackCore
        product: ScrollbackCore
    info:
      path: Apps/Mac/Info.plist
      properties:
        CFBundleDisplayName: Scrollback
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        # Menu bar app: the Dock icon appears only while the window is open (see inDockWhileOpen).
        LSUIElement: true
        NSLocalNetworkUsageDescription: Scrollback sends your usage history to the Scrollback app on your iPhone.
        NSBonjourServices: [_scrollback._tcp]
        ScrollbackICloudContainer: $(SCROLLBACK_ICLOUD_CONTAINER)
    entitlements:
      path: Apps/Mac/ScrollbackMac.entitlements
      properties:
        # Production on every build, so the Mac and the phone (USB or TestFlight) share one database.
        com.apple.developer.icloud-container-environment: Production
        com.apple.developer.icloud-container-identifiers: [$(SCROLLBACK_ICLOUD_CONTAINER)]
        com.apple.developer.icloud-services: [CloudKit]
    settings:
      base:
        # .macos, not .mac: the app moved to this ID for iCloud and brings its old preferences along (ScrollbackMacApp).
        PRODUCT_BUNDLE_IDENTIFIER: $(SCROLLBACK_BUNDLE_ID).macos
        PRODUCT_NAME: Scrollback
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
  ScrollbackiOS:
    type: application
    platform: iOS
    sources: [Apps/Shared, Apps/iOS, Apps/ScreenTimeShared]
    dependencies:
      - package: ScrollbackCore
        product: ScrollbackCore
      - target: ScrollbackReport
      - target: ScrollbackMonitor
      - target: ScrollbackWidget
    scheme:
      testTargets: [ScrollbackiOSUITests]
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: Scrollback
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Scrollback looks for your Mac on this Wi-Fi to fetch your usage history.
        NSBonjourServices: [_scrollback._tcp]
        ScrollbackPeerKey: $(SCROLLBACK_PEER_KEY)
        ScrollbackICloudContainer: $(SCROLLBACK_ICLOUD_CONTAINER)
        ScrollbackAppGroup: $(SCROLLBACK_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SCROLLBACK_BUNDLE_ID)
        PRODUCT_NAME: Scrollback
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Apps/iOS/Scrollback.entitlements
  ScrollbackReport:
    type: extensionkit-extension
    platform: iOS
    sources: [Extensions/Report, Apps/ScreenTimeShared, Apps/Shared/Theme.swift]
    dependencies:
      - package: ScrollbackCore
        product: ScrollbackCore
    info:
      path: Extensions/Report/Info.plist
      properties:
        CFBundleDisplayName: Scrollback Report
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    entitlements:
      path: Extensions/Report/Report.entitlements
      properties:
        com.apple.developer.family-controls: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SCROLLBACK_BUNDLE_ID).report
        TARGETED_DEVICE_FAMILY: "1"
  ScrollbackMonitor:
    type: app-extension
    platform: iOS
    sources: [Extensions/Monitor, Apps/ScreenTimeShared]
    dependencies:
      - package: ScrollbackCore
        product: ScrollbackCore
    info:
      path: Extensions/Monitor/Info.plist
      properties:
        CFBundleDisplayName: Scrollback Monitor
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).Monitor
        ScrollbackAppGroup: $(SCROLLBACK_APP_GROUP)
    entitlements:
      path: Extensions/Monitor/Monitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(SCROLLBACK_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SCROLLBACK_BUNDLE_ID).monitor
        TARGETED_DEVICE_FAMILY: "1"
  ScrollbackWidget:
    type: app-extension
    platform: iOS
    sources: [Extensions/Widget, Apps/Shared/Theme.swift]
    dependencies:
      - package: ScrollbackCore
        product: ScrollbackCore
    info:
      path: Extensions/Widget/Info.plist
      properties:
        CFBundleDisplayName: Scrollback Widgets
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        ScrollbackAppGroup: $(SCROLLBACK_APP_GROUP)
    entitlements:
      path: Extensions/Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups: [$(SCROLLBACK_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SCROLLBACK_BUNDLE_ID).widget
        TARGETED_DEVICE_FAMILY: "1"
  ScrollbackiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Apps/iOSUITests]
    dependencies:
      - target: ScrollbackiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SCROLLBACK_BUNDLE_ID).uitests
        # XCTest's setUp isn't main-actor isolated; Swift 6 checks only get in the way of UI test code.
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
