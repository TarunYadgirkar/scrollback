name: Scrollback
options:
  bundleIdPrefix: com.tarunyadgirkar
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 5AKJYZ7USP
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  ScrollbackCore:
    path: Packages/ScrollbackCore
targets:
  ScrollbackMac:
    type: application
    platform: macOS
    sources: [Apps/Shared, Apps/Mac]
    dependencies:
      - package: ScrollbackCore
        product: ScrollbackCore
    info:
      path: Apps/Mac/Info.plist
      properties:
        CFBundleDisplayName: Scrollback
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSLocalNetworkUsageDescription: Scrollback sends your usage history to the Scrollback app on your iPhone.
        NSBonjourServices: [_scrollback._tcp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarunyadgirkar.scrollback.mac
        PRODUCT_NAME: Scrollback
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
  ScrollbackiOS:
    type: application
    platform: iOS
    sources: [Apps/Shared, Apps/iOS, Apps/ScreenTimeShared]
    dependencies:
      - package: ScrollbackCore
        product: ScrollbackCore
      - target: ScrollbackReport
      - target: ScrollbackMonitor
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: Scrollback
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Scrollback looks for your Mac on this Wi-Fi to fetch your usage history.
        NSBonjourServices: [_scrollback._tcp]
        ScrollbackPeerKey: $(SCROLLBACK_PEER_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarunyadgirkar.scrollback
        PRODUCT_NAME: Scrollback
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Apps/iOS/Scrollback.entitlements
  ScrollbackReport:
    type: extensionkit-extension
    platform: iOS
    sources: [Extensions/Report, Apps/ScreenTimeShared, Apps/Shared/Theme.swift]
    dependencies:
      - package: ScrollbackCore
        product: ScrollbackCore
    info:
      path: Extensions/Report/Info.plist
      properties:
        CFBundleDisplayName: Scrollback Report
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    entitlements:
      path: Extensions/Report/Report.entitlements
      properties:
        com.apple.developer.family-controls: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarunyadgirkar.scrollback.report
        TARGETED_DEVICE_FAMILY: "1"
  ScrollbackMonitor:
    type: app-extension
    platform: iOS
    sources: [Extensions/Monitor, Apps/ScreenTimeShared]
    dependencies:
      - package: ScrollbackCore
        product: ScrollbackCore
    info:
      path: Extensions/Monitor/Info.plist
      properties:
        CFBundleDisplayName: Scrollback Monitor
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).Monitor
    entitlements:
      path: Extensions/Monitor/Monitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.tarunyadgirkar.scrollback]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarunyadgirkar.scrollback.monitor
        TARGETED_DEVICE_FAMILY: "1"
